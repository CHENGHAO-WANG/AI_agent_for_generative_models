[project]
name = "genagent"
version = "0.3.1"
description = "Toolkit behind an AI agent (Claude Code plugin) that performs data- and objective-dependent generative modeling"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.14",
    "torchvision",
    "numpy>=2",
    "pandas",
    "pyarrow",
    "scikit-learn",
    "scipy",
    "matplotlib",
    "optuna",
    "diffusers",
    "zuko",
    "ctgan",
    "scvi-tools",
    "scanpy",
    "anndata",
    "leidenalg",
    "igraph",
    "medmnist",
    "sdmetrics",
    "markdown",
    "gpytorch>=1.15.2",
    "xhtml2pdf>=0.2.26",
]

[project.scripts]
genagent = "genagent.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genagent"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
